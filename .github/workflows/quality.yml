name: Quality Checks

on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches-ignore:
      - develop
      - main
      - master

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Lint
        run: yarn lint

      - name: Structure tests
        run: yarn test:structure

      - name: Duplication check
        run: yarn dup:check

      - name: Upload jscpd report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jscpd-report
          path: report/jscpd
          retention-days: 7
