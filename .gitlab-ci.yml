stages:
  - quality

# 只在 MR 或 scheduled pipeline 下创建 pipeline。
# 普通 git push 不触发流水线，避免 "0 jobs" 产生误导性的红色 failed badge。
workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - when: never

default:
  image: node:18-alpine
  cache:
    key:
      files:
        - yarn.lock
    paths:
      - node_modules/

.only-mr: &only-mr
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

install:
  stage: quality
  script:
    - yarn install --frozen-lockfile
  artifacts:
    paths:
      - node_modules/
    expire_in: 1 hour
  <<: *only-mr

lint:
  stage: quality
  needs: [install]
  script:
    - yarn lint
  <<: *only-mr

structure-tests:
  stage: quality
  needs: [install]
  script:
    - yarn test:structure
  <<: *only-mr

duplication:
  stage: quality
  needs: [install]
  script:
    - yarn dup:check
  artifacts:
    when: always
    paths:
      - report/jscpd/
    expire_in: 1 week
  <<: *only-mr

# 波次 3：熵扫描（scheduled）
# 需要在 GitLab Settings → CI/CD → Schedules 新建：cron "0 0 * * 1"（每周一 00:00）
# target develop 分支。需要在 Settings → CI/CD → Variables 配一个 GITLAB_BOT_TOKEN
# （api scope 的 project access token），automatic generate-tech-debt-pr.js 要用。
entropy-report:
  stage: quality
  image: node:18-alpine
  before_script:
    - apk add --no-cache git
    - yarn install --frozen-lockfile
  script:
    - node scripts/entropy-scan.js > entropy.json
    - node scripts/generate-tech-debt-pr.js entropy.json
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
  artifacts:
    paths:
      - entropy.json
    expire_in: 1 month
