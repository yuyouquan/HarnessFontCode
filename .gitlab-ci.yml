stages:
  - install
  - quality

# 所有 feature 分支的 push 都跑 CI；develop/main 合进来的不重复跑；
# 熵扫描由 schedule 触发，见文件底部。
#
# tags: tones-ci-sit  —— 匹配项目已启用的专属 Runner (9f1121f1)
#
# YARN_REGISTRY：公司内部前端私服（CI runner 无法访问境外 registry.yarnpkg.com）
variables:
  YARN_REGISTRY: "https://npm-fe.transsion.com/"

install:
  image: node:18-alpine
  stage: install
  tags:
    - tones-ci-sit
  script:
    - yarn install --frozen-lockfile --registry "$YARN_REGISTRY"
  cache:
    key: $CI_COMMIT_REF_SLUG
    paths:
      - node_modules/
  artifacts:
    paths:
      - node_modules/
    expire_in: 1 hour
  except:
    - develop
    - main
    - master
    - schedules

lint:
  image: node:18-alpine
  stage: quality
  tags:
    - tones-ci-sit
  script:
    - yarn lint
  except:
    - develop
    - main
    - master
    - schedules

structure-tests:
  image: node:18-alpine
  stage: quality
  tags:
    - tones-ci-sit
  script:
    - yarn test:structure
  except:
    - develop
    - main
    - master
    - schedules

duplication:
  image: node:18-alpine
  stage: quality
  tags:
    - tones-ci-sit
  script:
    - yarn dup:check
  artifacts:
    when: always
    paths:
      - report/jscpd/
    expire_in: 1 week
  except:
    - develop
    - main
    - master
    - schedules

# 熵扫描：schedule 触发，需在 GitLab Settings → CI/CD → Schedules 配 cron "0 0 * * 1"
# 和 Variables 里配 GITLAB_BOT_TOKEN（api scope）
entropy-report:
  only:
    - schedules
  image: node:18-alpine
  stage: quality
  tags:
    - tones-ci-sit
  before_script:
    - apk add --no-cache git
    - yarn install --frozen-lockfile --registry "$YARN_REGISTRY"
  script:
    - node scripts/entropy-scan.js > entropy.json
    - node scripts/generate-tech-debt-pr.js entropy.json
  artifacts:
    paths:
      - entropy.json
    expire_in: 1 month
