stages:
  - install
  - quality

# 只在 merge request 触发的 pipeline 上跑（老 GitLab 兼容语法）
.only-mr:
  only:
    - merge_requests

install:
  extends: .only-mr
  image: node:18-alpine
  stage: install
  script:
    - yarn install --frozen-lockfile
  cache:
    key: $CI_COMMIT_REF_SLUG
    paths:
      - node_modules/
  artifacts:
    paths:
      - node_modules/
    expire_in: 1 hour

lint:
  extends: .only-mr
  image: node:18-alpine
  stage: quality
  script:
    - yarn lint

structure-tests:
  extends: .only-mr
  image: node:18-alpine
  stage: quality
  script:
    - yarn test:structure

duplication:
  extends: .only-mr
  image: node:18-alpine
  stage: quality
  script:
    - yarn dup:check
  artifacts:
    when: always
    paths:
      - report/jscpd/
    expire_in: 1 week

# 熵扫描（scheduled 触发，需在 GitLab Settings → CI/CD → Schedules 配 cron "0 0 * * 1"
# 以及 Variables 里配 GITLAB_BOT_TOKEN，api scope）
entropy-report:
  only:
    - schedules
  image: node:18-alpine
  stage: quality
  before_script:
    - apk add --no-cache git
    - yarn install --frozen-lockfile
  script:
    - node scripts/entropy-scan.js > entropy.json
    - node scripts/generate-tech-debt-pr.js entropy.json
  artifacts:
    paths:
      - entropy.json
    expire_in: 1 month
